openapi: 3.1.0
info:
  title: GPSART API
  version: 0.1.0
paths:
  /api/v1/route-jobs:
    post:
      summary: Create an idempotent private route-generation job
      security: [{ guestSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRouteJob' }
            example: { resolved_start_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, revision: 1, idempotency_key: request-1, requested_distance_metres: 5000, distance_tolerance_metres: 250, profile: { activity: walking, profile_version: walking-v1 }, coverage_policy_version: coverage-v1, template_id: heart, template_version: '1', map_data_version: map-v1, algorithm_version: algorithm-v1 }
      responses:
        '202':
          description: Job queued, or the original job for an identical retry.
          content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedRouteJob' }, example: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, state: queued, request_revision: 1 } } }
        '400': { $ref: '#/components/responses/InvalidJobRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '409': { $ref: '#/components/responses/JobConflict' }
        '503': { $ref: '#/components/responses/JobUnavailable' }
  /api/v1/route-jobs/{job_id}:
    delete:
      summary: Idempotently cancel an owned active job
      security: [{ guestSession: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      responses:
        '200': { description: Current terminal state, content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: [succeeded, no_match, failed, cancelled, timed_out] } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '503': { $ref: '#/components/responses/JobUnavailable' }
  /api/v1/guest-sessions:
    post:
      summary: Issue an opaque private guest session
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string, format: uri }
      responses:
        '201':
          description: Session issued. The credential is returned only as a Secure, HttpOnly, SameSite=Lax cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSessionPolicy' }
              example: { expires_at: 1790995200, rotate_at: 1790952000, rotate_after: 43200 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/guest-sessions/current:
    delete:
      summary: Revoke the current guest session
      description: Requires the session cookie, exact Origin, CSRF cookie, and matching X-CSRF-Token.
      security:
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      responses:
        '204':
          description: Revoked; both browser cookies are expired.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/guest-sessions/current/rotate:
    post:
      summary: Atomically rotate the current guest credential
      description: Clients rotate after the policy interval. Requires exact Origin and double-submit CSRF protection.
      security:
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      responses:
        '200':
          description: Previous digest revoked and replacement session issued
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSessionPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Rotation was requested before the server-provided rotate_at time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: rotation_not_due }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/designs:
    get:
      summary: List published versioned design templates
      description: Catalogue membership indicates reviewed design support, not local routing feasibility.
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [shape, text] }
      responses:
        '200':
          description: Published designs only
          content:
            application/json:
              schema:
                type: object
                required: [designs]
                properties:
                  designs:
                    type: array
                    items: { $ref: '#/components/schemas/DesignSummary' }
              examples:
                text:
                  value:
                    designs:
                      - id: HI
                        version: 1
                        status: published
                        category: text
                        name: HI
                        complexity_hint: moderate
                        preview_svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">...</svg>'
                        definition_hash: 64-lowercase-hex-characters
        '400': { description: Unsupported category }
  /api/v1/coverage:
    get:
      summary: Read the versioned pilot coverage boundary
      description: Coverage membership does not claim that a route is feasible at a point.
      responses:
        '200':
          description: Versioned GeoJSON coverage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coverage' }
              example:
                version: coverage-v1
                geojson:
                  type: Feature
                  properties: { coverage_policy_version: coverage-v1, local_route_feasibility: not_evaluated }
                  geometry: { type: Polygon, coordinates: [[[77.0, 28.0], [78.0, 28.0], [78.0, 29.0], [77.0, 29.0], [77.0, 28.0]]] }
                local_route_feasibility: not_evaluated
  /api/v1/starts/resolve:
    post:
      summary: Propose a profile-aware routable start
      description: Exact coordinates are accepted only in this private request body and are never URL parameters.
      security:
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveStartRequest' }
            example:
              requested_point: { longitude: 77.2, latitude: 28.6 }
              profile: { activity: walking, profile_version: walking-v1 }
      responses:
        '200':
          description: A proposal requiring explicit confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartResolution' }
              example:
                id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0
                requested_point: { longitude: 77.2, latitude: 28.6 }
                candidate_network_point: { longitude: 77.2001, latitude: 28.6001 }
                snap_distance_metres: 15
                profile_version: walking-v1
                coverage_policy_version: coverage-v1
                data_version: map-v1
                expires_at_epoch_seconds: 1800000000
                confirmation_required: true
        '400':
          description: Invalid coordinates or malformed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              examples:
                malformed: { value: { outcome: { code: invalid_request } } }
                coordinates: { value: { outcome: { code: invalid_coordinates } } }
        '401':
          description: Missing guest-session authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: authentication_required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Unsupported coverage or no routable access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              examples:
                outside: { value: { outcome: { code: unsupported_coverage } } }
                noAccess: { value: { outcome: { code: no_routable_access } } }
        '502':
          description: Routing provider failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: provider_failure } }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/starts/{resolution_id}/confirm:
    post:
      summary: Explicitly confirm a proposed start displaced by at most 30 metres
      security:
        - guestSession: []
      parameters:
        - in: path
          name: resolution_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: '#/components/schemas/RouteProfile' }
              example:
                profile: { activity: walking, profile_version: walking-v1 }
      responses:
        '200':
          description: Confirmed candidate network point
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedStart' }
              example: { confirmed_start: { longitude: 77.2, latitude: 28.6 } }
        '400':
          description: Malformed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: invalid_request } }
        '401':
          description: Missing guest-session authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: authentication_required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Resolution is private to another session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: wrong_session } }
        '409':
          description: Profile, policy, or data version changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              examples:
                profile: { value: { outcome: { code: profile_changed } } }
                policy: { value: { outcome: { code: coverage_policy_changed } } }
                data: { value: { outcome: { code: data_version_changed } } }
        '410':
          description: Resolution expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: expired_resolution } }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        '422':
          description: Snap exceeds 30 metres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: snap_too_far } }
components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: gpsart_guest
      description: Opaque Secure, HttpOnly, SameSite=Lax guest-session credential.
  parameters:
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string, format: uri }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Must exactly match the non-HttpOnly gpsart_csrf cookie.
      schema: { type: string, minLength: 1 }
    CsrfCookie:
      in: cookie
      name: gpsart_csrf
      required: true
      description: Readable double-submit cookie; its value must match X-CSRF-Token.
      schema: { type: string, minLength: 1 }
  headers:
    SetCookie:
      description: Session and CSRF cookie mutations. Multiple Set-Cookie fields may be returned.
      schema: { type: string }
  responses:
    InvalidJobRequest: { description: Complete request validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: invalid_request } } } }
    PrivateNotFound: { description: Owned resource is absent, stale, or belongs to another session, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: not_found } } } }
    JobConflict: { description: Idempotency key or job state conflict, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: idempotency_conflict } } } }
    JobUnavailable: { description: Durable job storage unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: job_storage_unavailable } } } }
    Unauthenticated:
      description: Missing, expired, or revoked session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: authentication_required }
    Forbidden:
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: request_forbidden }
    AuthUnavailable:
      description: Authentication storage unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: authentication_unavailable }
  schemas:
    CreateRouteJob:
      type: object
      additionalProperties: false
      required: [resolved_start_id, revision, idempotency_key, requested_distance_metres, distance_tolerance_metres, profile, coverage_policy_version, template_id, template_version, map_data_version, algorithm_version]
      properties:
        resolved_start_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
        requested_distance_metres: { type: integer, minimum: 1 }
        distance_tolerance_metres: { type: integer, minimum: 0 }
        profile: { $ref: '#/components/schemas/RouteProfile' }
        coverage_policy_version: { type: string, minLength: 1 }
        template_id: { type: string, minLength: 1 }
        template_version: { type: string, minLength: 1 }
        map_data_version: { type: string, minLength: 1 }
        algorithm_version: { type: string, minLength: 1 }
    AcceptedRouteJob:
      type: object
      additionalProperties: false
      required: [job_id, state, request_revision]
      properties:
        job_id: { type: string, format: uuid }
        state: { const: queued }
        request_revision: { type: integer, minimum: 1 }
    JobError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [invalid_request, not_found, idempotency_conflict, job_state_conflict, job_storage_unavailable] }
    ApiError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [authentication_required, request_forbidden, authentication_unavailable, rotation_not_due, not_found]
    GuestSessionPolicy:
      type: object
      additionalProperties: false
      required: [expires_at, rotate_at, rotate_after]
      properties:
        expires_at: { type: integer, minimum: 1, description: Unix timestamp in seconds }
        rotate_at: { type: integer, minimum: 1, description: Earliest credential rotation time as a Unix timestamp in seconds }
        rotate_after: { type: integer, minimum: 1, description: Credential rotation interval in seconds }
    DesignSummary:
      type: object
      additionalProperties: false
      required: [id, version, status, category, name, complexity_hint, preview_svg, definition_hash]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        status: { const: published }
        category: { type: string, enum: [shape, text] }
        name: { type: string }
        complexity_hint: { type: string }
        preview_svg: { type: string }
        definition_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    GeoPoint:
      type: object
      additionalProperties: false
      required: [longitude, latitude]
      properties:
        longitude: { type: number, minimum: -180, maximum: 180 }
        latitude: { type: number, minimum: -90, maximum: 90 }
    RouteProfile:
      type: object
      additionalProperties: false
      required: [activity, profile_version]
      properties:
        activity: { type: string, enum: [walking, running, cycling] }
        profile_version: { type: string, enum: [walking-v1, running-v1, cycling-v1] }
    Coverage:
      type: object
      additionalProperties: false
      required: [version, geojson, local_route_feasibility]
      properties:
        version: { type: string }
        geojson: { type: object }
        local_route_feasibility: { const: not_evaluated }
    ResolveStartRequest:
      type: object
      additionalProperties: false
      required: [requested_point, profile]
      properties:
        requested_point: { $ref: '#/components/schemas/GeoPoint' }
        profile: { $ref: '#/components/schemas/RouteProfile' }
    StartResolution:
      type: object
      additionalProperties: false
      required: [id, requested_point, candidate_network_point, snap_distance_metres, profile_version, coverage_policy_version, data_version, expires_at_epoch_seconds, confirmation_required]
      properties:
        id: { type: string, format: uuid }
        requested_point: { $ref: '#/components/schemas/GeoPoint' }
        candidate_network_point: { $ref: '#/components/schemas/GeoPoint' }
        snap_distance_metres: { type: integer, minimum: 0 }
        profile_version: { type: string, enum: [walking-v1, running-v1, cycling-v1] }
        coverage_policy_version: { type: string }
        data_version: { type: string }
        expires_at_epoch_seconds: { type: integer, minimum: 1 }
        confirmation_required: { const: true }
    ConfirmedStart:
      type: object
      additionalProperties: false
      required: [confirmed_start]
      properties:
        confirmed_start: { $ref: '#/components/schemas/GeoPoint' }
    StartError:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_coordinates, unsupported_coverage, no_routable_access, provider_failure, expired_resolution, wrong_session, profile_changed, coverage_policy_changed, data_version_changed, snap_too_far, authorization_required]
