openapi: 3.1.0
info:
  title: GPSART API
  version: 0.1.0
paths:
  /api/v1/route-jobs:
    post:
      summary: Create an idempotent private route-generation job
      security: [{ guestSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRouteJob' }
            example: { resolved_start_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, revision: 1, idempotency_key: request-1, requested_distance_metres: 5000, distance_tolerance_metres: 250, return_to_start: true, profile: { activity: walking, profile_version: walking-v1 }, coverage_policy_version: coverage-v1, template_id: heart, template_version: '1', map_data_version: map-v1, algorithm_version: algorithm-v1 }
      responses:
        '202':
          description: Job queued, or the original job for an identical retry.
          content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedRouteJob' }, example: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1 } } }
        '400': { $ref: '#/components/responses/InvalidJobRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '409': { $ref: '#/components/responses/JobConflict' }
        '503': { $ref: '#/components/responses/JobUnavailable' }
  /api/v1/route-jobs/{job_id}:
    get:
      summary: Read the current truthful status of an owned route-generation job
      description: Returns observed coarse stages only. The ETag changes monotonically with durable status_version; no percentage is estimated.
      security: [{ guestSession: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: If-None-Match, required: false, schema: { type: string } }
      responses:
        '200':
          description: Current durable job status
          headers:
            ETag: { description: Durable status version validator, schema: { type: string, example: '"5"' } }
            Cache-Control: { description: Private revalidation policy, schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteJobStatus' }
              examples:
                active:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: running, stage: fitting_design, status_version: 3, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: null, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: null, result_ids: [], poll_after_seconds: 1 }
                succeeded:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: succeeded, stage: comparing_routes, status_version: 5, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995040, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: succeeded, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [8bf80ccf-68e8-49ec-a3e8-cad667bb95a0], poll_after_seconds: null }
                unsupportedCoverage:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: no_match, stage: checking_roads, status_version: 3, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995002, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: unsupported_coverage, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                noRoutableAccess:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: no_match, stage: checking_roads, status_version: 3, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995002, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: no_routable_access, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                disconnectedNetwork:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: no_match, stage: fitting_design, status_version: 4, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995020, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: disconnected_network, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                insufficientVisualMatch:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: no_match, stage: comparing_routes, status_version: 5, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995040, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: insufficient_visual_match, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                outsideDistance:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: no_match, stage: comparing_routes, status_version: 5, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995040, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: outside_distance, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                exhaustedBudget:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: no_match, stage: comparing_routes, status_version: 5, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995060, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: exhausted_budget, budget_exhausted: true, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                providerUnavailable:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: failed, stage: checking_roads, status_version: 3, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995002, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: provider_unavailable, budget_exhausted: false, retryable: true, retry_after_seconds: 30 }, result_ids: [], poll_after_seconds: null }
                attemptsExhausted:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: failed, stage: checking_roads, status_version: 5, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995030, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: attempts_exhausted, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                cancelled:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: cancelled, stage: fitting_design, status_version: 4, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995020, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: cancelled, budget_exhausted: false, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
                timedOut:
                  value: { job_id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0, request_revision: 1, state: timed_out, stage: comparing_routes, status_version: 5, queued_at_epoch_seconds: 1790995000, started_at_epoch_seconds: 1790995001, completed_at_epoch_seconds: 1790995060, deadline_at_epoch_seconds: 1790995060, expires_at_epoch_seconds: 1791081400, outcome: { code: timed_out, budget_exhausted: true, retryable: false, retry_after_seconds: null }, result_ids: [], poll_after_seconds: null }
        '304':
          description: Status version is unchanged; response has no body
          headers:
            ETag: { description: Durable status version validator, schema: { type: string } }
            Cache-Control: { description: Private revalidation policy, schema: { type: string, const: 'private, no-cache' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '503': { $ref: '#/components/responses/JobUnavailable' }
    delete:
      summary: Idempotently cancel an owned active job
      security: [{ guestSession: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      responses:
        '200': { description: Current terminal state, content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: [succeeded, no_match, failed, cancelled, timed_out] } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '503': { $ref: '#/components/responses/JobUnavailable' }
  /api/v1/routes/{route_id}:
    get:
      summary: Fetch one immutable owned route-candidate snapshot without recalculation
      description: Every map, instruction, direction, duration, distance, quality, and provenance field derives from the same ordered snapshot. Unknown optional metadata is absent.
      security: [{ guestSession: [] }]
      parameters:
        - { in: path, name: route_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exact immutable route snapshot
          headers:
            Cache-Control: { description: Private snapshots must not be stored by shared or browser HTTP caches, schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteCandidateSnapshot' }
              example:
                id: 40000000-0000-4000-8000-000000000001
                generation_job_id: 30000000-0000-4000-8000-000000000001
                candidate_version: 1
                request_revision: 4
                geometry: { type: LineString, coordinates: [[77.6, 12.9], [77.601, 12.901], [77.6, 12.901], [77.601, 12.9], [77.6, 12.9]] }
                traversals:
                  - { edge_id: art, class: artwork, direction: forward, begin_geometry_index: 0, end_geometry_index: 2, distance_metres: 600, retraced: false }
                  - { edge_id: connector, class: connector, direction: reverse, begin_geometry_index: 2, end_geometry_index: 4, distance_metres: 400, retraced: true }
                distances: { artwork_metres: 600, connector_metres: 400, total_metres: 1000, repeated_metres: 400, repeated_included_in_total: true, equality_tolerance_metres: 1 }
                quality_band: approximate_match
                qualifications: { legality_version: candidate-legality-v1, route_use_advisory_version: route-use-advisory-v1, access_verified: true, direction_verified: true, turns_verified: true }
                versions: { snapshot: route-candidate-snapshot-v1, request: route-request-v1, profile: walking-v1, template_id: heart, template: 1, template_hash: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff, algorithm: algorithm-v1, routing_data: map-v1, routing_policy: osm-pedestrian-policy-v2, candidate: 1 }
                generated_at_epoch_seconds: 1800000000
                provenance: { routing_provider: controlled-local-osm, attribution: OpenStreetMap contributors }
                start: [77.6, 12.9]
                finish: [77.6, 12.9]
                duration_seconds: 720
                instructions: [{ kind: depart, geometry_index: 0 }, { kind: via, geometry_index: 2 }, { kind: arrive, geometry_index: 4 }]
                direction_markers: [{ traversal_index: 0, coordinate: [77.6, 12.9], direction: forward }, { traversal_index: 1, coordinate: [77.6, 12.901], direction: reverse }]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '503':
          description: Snapshot storage is unavailable or failed immutable validation
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteSnapshotError' }, example: { code: route_storage_unavailable } } }
  /api/v1/routes/{route_id}/export.gpx:
    get:
      summary: Export the exact immutable owned route as a planned GPX 1.1 track
      description: Serializes every stored point in order without rerouting, simplifying, or adding recorded-activity data. Connectors and retraced sections remain in the single ordered track segment.
      security: [{ guestSession: [] }]
      parameters:
        - { in: path, name: route_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exact planned route in GPX 1.1 format
          headers:
            Cache-Control: { description: Private exports are not cached, schema: { type: string, const: 'private, no-store' } }
            Content-Disposition: { description: Predictable sanitized attachment filename, schema: { type: string, example: 'attachment; filename="gpsart-heart-40000000-0000-4000-8000-000000000001-v1.gpx"' } }
            X-Content-Type-Options: { description: Prevent content-type sniffing, schema: { type: string, const: nosniff } }
          content:
            application/gpx+xml:
              schema: { type: string, contentMediaType: application/gpx+xml }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/PrivateNotFound' }
        '503':
          description: Snapshot storage is unavailable or failed immutable validation
          content: { application/json: { schema: { $ref: '#/components/schemas/RouteSnapshotError' }, example: { code: route_storage_unavailable } } }
  /api/v1/guest-sessions:
    post:
      summary: Issue an opaque private guest session
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string, format: uri }
      responses:
        '201':
          description: Session issued. The credential is returned only as a Secure, HttpOnly, SameSite=Lax cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSessionPolicy' }
              example: { expires_at: 1790995200, rotate_at: 1790952000, rotate_after: 43200 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/guest-sessions/current:
    delete:
      summary: Revoke the current guest session
      description: Requires the session cookie, exact Origin, CSRF cookie, and matching X-CSRF-Token.
      security:
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      responses:
        '204':
          description: Revoked; both browser cookies are expired.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/guest-sessions/current/rotate:
    post:
      summary: Atomically rotate the current guest credential
      description: Clients rotate after the policy interval. Requires exact Origin and double-submit CSRF protection.
      security:
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      responses:
        '200':
          description: Previous digest revoked and replacement session issued
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSessionPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Rotation was requested before the server-provided rotate_at time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: rotation_not_due }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/designs:
    get:
      summary: List published versioned design templates
      description: Catalogue membership indicates reviewed design support, not local routing feasibility.
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [shape, text] }
      responses:
        '200':
          description: Published designs only
          content:
            application/json:
              schema:
                type: object
                required: [designs]
                properties:
                  designs:
                    type: array
                    items: { $ref: '#/components/schemas/DesignSummary' }
              examples:
                text:
                  value:
                    designs:
                      - id: HI
                        version: 1
                        status: published
                        category: text
                        name: HI
                        complexity_hint: moderate
                        preview_svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">...</svg>'
                        definition_hash: 64-lowercase-hex-characters
        '400': { description: Unsupported category }
  /api/v1/coverage:
    get:
      summary: Read the versioned pilot coverage boundary
      description: Coverage membership does not claim that a route is feasible at a point.
      responses:
        '200':
          description: Versioned GeoJSON coverage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coverage' }
              example:
                version: coverage-v1
                geojson:
                  type: Feature
                  properties: { coverage_policy_version: coverage-v1, local_route_feasibility: not_evaluated }
                  geometry: { type: Polygon, coordinates: [[[77.0, 28.0], [78.0, 28.0], [78.0, 29.0], [77.0, 29.0], [77.0, 28.0]]] }
                local_route_feasibility: not_evaluated
  /api/v1/starts/resolve:
    post:
      summary: Propose a profile-aware routable start
      description: Exact coordinates are accepted only in this private request body and are never URL parameters.
      security:
        - guestSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveStartRequest' }
            example:
              requested_point: { longitude: 77.2, latitude: 28.6 }
              profile: { activity: walking, profile_version: walking-v1 }
      responses:
        '200':
          description: A proposal requiring explicit confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartResolution' }
              example:
                id: 7bf80ccf-68e8-49ec-a3e8-cad667bb95a0
                requested_point: { longitude: 77.2, latitude: 28.6 }
                candidate_network_point: { longitude: 77.2001, latitude: 28.6001 }
                snap_distance_metres: 15
                profile_version: walking-v1
                coverage_policy_version: coverage-v1
                data_version: map-v1
                expires_at_epoch_seconds: 1800000000
                confirmation_required: true
        '400':
          description: Invalid coordinates or malformed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              examples:
                malformed: { value: { outcome: { code: invalid_request } } }
                coordinates: { value: { outcome: { code: invalid_coordinates } } }
        '401':
          description: Missing guest-session authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: authentication_required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Unsupported coverage or no routable access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              examples:
                outside: { value: { outcome: { code: unsupported_coverage } } }
                noAccess: { value: { outcome: { code: no_routable_access } } }
        '502':
          description: Routing provider failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: provider_failure } }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/starts/{resolution_id}/confirm:
    post:
      summary: Explicitly confirm a proposed start displaced by at most 30 metres
      security:
        - guestSession: []
      parameters:
        - in: path
          name: resolution_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CsrfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: '#/components/schemas/RouteProfile' }
              example:
                profile: { activity: walking, profile_version: walking-v1 }
      responses:
        '200':
          description: Confirmed candidate network point
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedStart' }
              example: { confirmed_start: { longitude: 77.2, latitude: 28.6 } }
        '400':
          description: Malformed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: invalid_request } }
        '401':
          description: Missing guest-session authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: authentication_required }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Resolution is private to another session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: wrong_session } }
        '409':
          description: Profile, policy, or data version changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              examples:
                profile: { value: { outcome: { code: profile_changed } } }
                policy: { value: { outcome: { code: coverage_policy_changed } } }
                data: { value: { outcome: { code: data_version_changed } } }
        '410':
          description: Resolution expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: expired_resolution } }
        '503':
          description: Guest-session authentication or confirmed-start storage is unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiError' }
                  - { $ref: '#/components/schemas/StartError' }
              examples:
                authentication: { value: { code: authentication_unavailable } }
                storage: { value: { outcome: { code: storage_unavailable } } }
        '422':
          description: Snap exceeds 30 metres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartError' }
              example: { outcome: { code: snap_too_far } }
components:
  securitySchemes:
    guestSession:
      type: apiKey
      in: cookie
      name: gpsart_guest
      description: Opaque Secure, HttpOnly, SameSite=Lax guest-session credential.
  parameters:
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string, format: uri }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Must exactly match the non-HttpOnly gpsart_csrf cookie.
      schema: { type: string, minLength: 1 }
    CsrfCookie:
      in: cookie
      name: gpsart_csrf
      required: true
      description: Readable double-submit cookie; its value must match X-CSRF-Token.
      schema: { type: string, minLength: 1 }
  headers:
    SetCookie:
      description: Session and CSRF cookie mutations. Multiple Set-Cookie fields may be returned.
      schema: { type: string }
  responses:
    InvalidJobRequest: { description: Complete request validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: invalid_request } } } }
    PrivateNotFound: { description: Owned resource is absent, stale, or belongs to another session, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: not_found } } } }
    JobConflict: { description: Idempotency key or job state conflict, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: idempotency_conflict } } } }
    JobUnavailable: { description: Durable job storage unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/JobError' }, example: { code: job_storage_unavailable } } } }
    Unauthenticated:
      description: Missing, expired, or revoked session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: authentication_required }
    Forbidden:
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: request_forbidden }
    AuthUnavailable:
      description: Authentication storage unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: authentication_unavailable }
  schemas:
    CreateRouteJob:
      type: object
      additionalProperties: false
      required: [resolved_start_id, revision, idempotency_key, requested_distance_metres, distance_tolerance_metres, return_to_start, profile, coverage_policy_version, template_id, template_version, map_data_version, algorithm_version]
      properties:
        resolved_start_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
        requested_distance_metres: { type: integer, minimum: 1000, maximum: 100000 }
        distance_tolerance_metres: { type: integer, minimum: 0 }
        return_to_start: { type: boolean, description: Whether the generated route must finish at its confirmed start. }
        profile: { $ref: '#/components/schemas/RouteProfile' }
        coverage_policy_version: { type: string, minLength: 1 }
        template_id: { type: string, minLength: 1 }
        template_version: { type: string, minLength: 1 }
        map_data_version: { type: string, minLength: 1 }
        algorithm_version: { type: string, const: algorithm-v1 }
    AcceptedRouteJob:
      type: object
      additionalProperties: false
      required: [job_id, request_revision]
      properties:
        job_id: { type: string, format: uuid }
        request_revision: { type: integer, minimum: 1 }
    RouteJobStatus:
      type: object
      additionalProperties: false
      required: [job_id, request_revision, state, stage, status_version, queued_at_epoch_seconds, started_at_epoch_seconds, completed_at_epoch_seconds, deadline_at_epoch_seconds, expires_at_epoch_seconds, outcome, result_ids, poll_after_seconds]
      properties:
        job_id: { type: string, format: uuid }
        request_revision: { type: integer, minimum: 1 }
        state: { type: string, enum: [queued, running, succeeded, no_match, failed, cancelled, timed_out] }
        stage: { type: string, enum: [queued, checking_roads, fitting_design, comparing_routes], description: Last observed durable stage; it is not a percentage estimate. }
        status_version: { type: integer, minimum: 1 }
        queued_at_epoch_seconds: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        started_at_epoch_seconds: { type: [integer, 'null'], minimum: 0, description: Unix timestamp in seconds }
        completed_at_epoch_seconds: { type: [integer, 'null'], minimum: 0, description: Unix timestamp in seconds }
        deadline_at_epoch_seconds: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        expires_at_epoch_seconds: { type: integer, minimum: 0, description: Unix timestamp in seconds }
        outcome:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/RouteJobOutcome' }
        result_ids:
          type: array
          items: { type: string, format: uuid }
        poll_after_seconds: { type: [integer, 'null'], minimum: 1 }
    RouteJobOutcome:
      type: object
      additionalProperties: false
      required: [code, budget_exhausted, retryable, retry_after_seconds]
      properties:
        code:
          type: string
          enum: [succeeded, unsupported_coverage, no_routable_access, disconnected_network, insufficient_visual_match, outside_distance, exhausted_budget, provider_unavailable, attempts_exhausted, cancelled, timed_out, legacy_unknown]
        budget_exhausted: { type: boolean }
        retryable: { type: boolean }
        retry_after_seconds: { type: [integer, 'null'], minimum: 1 }
    RouteCandidateSnapshot:
      type: object
      additionalProperties: false
      required: [id, generation_job_id, candidate_version, request_revision, geometry, traversals, distances, quality_band, qualifications, versions, generated_at_epoch_seconds, provenance, start, finish, duration_seconds, instructions, direction_markers]
      properties:
        id: { type: string, format: uuid }
        generation_job_id: { type: string, format: uuid }
        candidate_version: { type: integer, minimum: 1 }
        request_revision: { type: integer, minimum: 1 }
        geometry: { $ref: '#/components/schemas/GeoJsonLineString' }
        traversals: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RouteTraversal' } }
        distances: { $ref: '#/components/schemas/RouteDistanceSummary' }
        quality_band: { type: string, enum: [strong_match, approximate_match] }
        qualifications: { $ref: '#/components/schemas/CandidateQualifications' }
        versions: { $ref: '#/components/schemas/RouteSnapshotVersions' }
        generated_at_epoch_seconds: { type: integer, minimum: 1 }
        provenance: { $ref: '#/components/schemas/RouteProvenance' }
        start: { $ref: '#/components/schemas/GeoJsonPosition' }
        finish: { $ref: '#/components/schemas/GeoJsonPosition' }
        duration_seconds: { type: integer, minimum: 1 }
        instructions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RouteInstruction' } }
        direction_markers: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RouteDirectionMarker' } }
    GeoJsonPosition:
      type: array
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      minItems: 2
      maxItems: 2
    GeoJsonLineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { const: LineString }
        coordinates: { type: array, minItems: 2, items: { $ref: '#/components/schemas/GeoJsonPosition' } }
    RouteTraversal:
      type: object
      additionalProperties: false
      required: [edge_id, class, direction, begin_geometry_index, end_geometry_index, distance_metres, retraced]
      properties:
        edge_id: { type: string, minLength: 1 }
        class: { type: string, enum: [artwork, connector, access, return] }
        direction: { type: string, enum: [forward, reverse] }
        begin_geometry_index: { type: integer, minimum: 0 }
        end_geometry_index: { type: integer, minimum: 1 }
        distance_metres: { type: integer, minimum: 1 }
        retraced: { type: boolean }
    RouteDistanceSummary:
      type: object
      additionalProperties: false
      required: [artwork_metres, connector_metres, total_metres, repeated_metres, repeated_included_in_total, equality_tolerance_metres]
      properties:
        artwork_metres: { type: integer, minimum: 0 }
        connector_metres: { type: integer, minimum: 0 }
        total_metres: { type: integer, minimum: 1 }
        repeated_metres: { type: integer, minimum: 0, description: Already included in total_metres; never add it again. }
        repeated_included_in_total: { const: true }
        equality_tolerance_metres: { type: integer, const: 1 }
    RouteSnapshotVersions:
      type: object
      additionalProperties: false
      required: [snapshot, request, profile, template_id, template, template_hash, algorithm, routing_data, routing_policy, candidate]
      properties:
        snapshot: { const: route-candidate-snapshot-v1 }
        request: { const: route-request-v1 }
        profile: { type: string, enum: [walking-v1, running-v1, cycling-v1] }
        template_id: { type: string, minLength: 1 }
        template: { type: integer, minimum: 1 }
        template_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        algorithm: { const: algorithm-v1 }
        routing_data: { type: string, minLength: 1 }
        routing_policy: { type: string, minLength: 1 }
        candidate: { type: integer, minimum: 1 }
    CandidateQualifications:
      type: object
      additionalProperties: false
      required: [legality_version, route_use_advisory_version, access_verified, direction_verified, turns_verified]
      properties:
        legality_version: { const: candidate-legality-v1 }
        route_use_advisory_version: { const: route-use-advisory-v1 }
        access_verified: { const: true }
        direction_verified: { const: true }
        turns_verified: { const: true }
    RouteProvenance:
      type: object
      additionalProperties: false
      required: [routing_provider]
      properties:
        routing_provider: { type: string, minLength: 1 }
        attribution: { type: string, minLength: 1 }
    RouteInstruction:
      type: object
      additionalProperties: false
      required: [kind, geometry_index]
      properties:
        kind: { type: string, enum: [depart, via, arrive, provider] }
        geometry_index: { type: integer, minimum: 0 }
        provider_code: { type: integer, minimum: 0, maximum: 255, description: Present only when kind is provider. }
    RouteDirectionMarker:
      type: object
      additionalProperties: false
      required: [traversal_index, coordinate, direction]
      properties:
        traversal_index: { type: integer, minimum: 0 }
        coordinate: { $ref: '#/components/schemas/GeoJsonPosition' }
        direction: { type: string, enum: [forward, reverse] }
    RouteSnapshotError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [not_found, route_storage_unavailable] }
    JobError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [invalid_request, not_found, idempotency_conflict, job_state_conflict, job_storage_unavailable] }
    ApiError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [authentication_required, request_forbidden, authentication_unavailable, rotation_not_due, not_found]
    GuestSessionPolicy:
      type: object
      additionalProperties: false
      required: [expires_at, rotate_at, rotate_after]
      properties:
        expires_at: { type: integer, minimum: 1, description: Unix timestamp in seconds }
        rotate_at: { type: integer, minimum: 1, description: Earliest credential rotation time as a Unix timestamp in seconds }
        rotate_after: { type: integer, minimum: 1, description: Credential rotation interval in seconds }
    DesignSummary:
      type: object
      additionalProperties: false
      required: [id, version, status, category, name, complexity_hint, preview_svg, definition_hash]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        status: { const: published }
        category: { type: string, enum: [shape, text] }
        name: { type: string }
        complexity_hint: { type: string }
        preview_svg: { type: string }
        definition_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    GeoPoint:
      type: object
      additionalProperties: false
      required: [longitude, latitude]
      properties:
        longitude: { type: number, minimum: -180, maximum: 180 }
        latitude: { type: number, minimum: -90, maximum: 90 }
    RouteProfile:
      type: object
      additionalProperties: false
      required: [activity, profile_version]
      properties:
        activity: { type: string, enum: [walking, running, cycling] }
        profile_version: { type: string, enum: [walking-v1, running-v1, cycling-v1] }
    Coverage:
      type: object
      additionalProperties: false
      required: [version, geojson, local_route_feasibility]
      properties:
        version: { type: string }
        geojson: { type: object }
        local_route_feasibility: { const: not_evaluated }
    ResolveStartRequest:
      type: object
      additionalProperties: false
      required: [requested_point, profile]
      properties:
        requested_point: { $ref: '#/components/schemas/GeoPoint' }
        profile: { $ref: '#/components/schemas/RouteProfile' }
    StartResolution:
      type: object
      additionalProperties: false
      required: [id, requested_point, candidate_network_point, snap_distance_metres, profile_version, coverage_policy_version, data_version, expires_at_epoch_seconds, confirmation_required]
      properties:
        id: { type: string, format: uuid }
        requested_point: { $ref: '#/components/schemas/GeoPoint' }
        candidate_network_point: { $ref: '#/components/schemas/GeoPoint' }
        snap_distance_metres: { type: integer, minimum: 0 }
        profile_version: { type: string, enum: [walking-v1, running-v1, cycling-v1] }
        coverage_policy_version: { type: string }
        data_version: { type: string }
        expires_at_epoch_seconds: { type: integer, minimum: 1 }
        confirmation_required: { const: true }
    ConfirmedStart:
      type: object
      additionalProperties: false
      required: [confirmed_start]
      properties:
        confirmed_start: { $ref: '#/components/schemas/GeoPoint' }
    StartError:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_coordinates, unsupported_coverage, no_routable_access, provider_failure, storage_unavailable, expired_resolution, wrong_session, profile_changed, coverage_policy_changed, data_version_changed, snap_too_far, authorization_required]
