[workspace]
resolver = "2"
members = [
  "crates/gpsart-api",
  "crates/gpsart-config",
  "crates/gpsart-domain",
  "crates/gpsart-observability",
  "crates/gpsart-persistence",
  "crates/gpsart-routing",
  "crates/gpsart-worker",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.22.1"
getrandom = "0.3.4"
gpx = "0.10.0"
http = "1.3.1"
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "time", "uuid"] }
thiserror = "2.0.17"
subtle = "2.6.1"
time = { version = "0.3.44", features = ["parsing"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

