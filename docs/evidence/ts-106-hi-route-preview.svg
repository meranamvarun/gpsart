<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" role="img" aria-labelledby="title description">
  <title id="title">TS-106 controlled HI full-route trace</title>
  <description id="description">The full closed route includes access, ordered H and I strokes, explicit connectors, retraced H segments, and return travel.</description>
  <rect width="180" height="170" fill="#f7f4ed"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path data-role="full-trace" d="M10 150 L35 125 L62 30 L62 65 L62 100 L62 65 L98 65 L98 100 L98 65 L98 30 L128 100 L128 30 L10 150" stroke="#253238" stroke-width="8" opacity="0.16"/>
    <path data-role="access" d="M10 150 L35 125 L62 30" stroke="#477b6b" stroke-width="3"/>
    <path data-role="artwork" d="M62 30 L62 65 L62 100 M62 65 L98 65 M98 100 L98 65 L98 30 M128 100 L128 30" stroke="#154c36" stroke-width="4"/>
    <path data-role="connector" d="M62 100 L62 65 M98 65 L98 100 M98 30 L128 100" stroke="#d97706" stroke-width="3" stroke-dasharray="5 4"/>
    <path data-role="return" d="M128 30 L10 150" stroke="#477b6b" stroke-width="3"/>
    <path data-role="retraced" d="M62 100 L62 65 M98 100 L98 65" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>
  <g fill="#154c36">
    <circle cx="10" cy="150" r="4"/>
    <circle cx="62" cy="30" r="3"/>
    <circle cx="128" cy="30" r="3"/>
  </g>
  <g font-family="sans-serif" font-size="7" fill="#253238">
    <text x="5" y="163">confirmed start / finish</text>
    <text x="66" y="16">ordered HI traversal</text>
    <text x="105" y="113" fill="#d97706">connector</text>
    <text x="43" y="82" fill="#8b5cf6">retrace</text>
  </g>
</svg>
