pid /tmp/nginx.pid;
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format privacy_safe '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout privacy_safe;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 64k;
    sendfile on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        location = /edge-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","code":"edge_live"}';
        }

        location /api/ {
            proxy_pass http://gpsart-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_request_buffering on;
        }

        location /health/ {
            proxy_pass http://gpsart-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
